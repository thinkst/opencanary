<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 Not Found</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        padding: 46px 40px;
        background: #cfcfcf;
        color: #000000;
        font-family: helvetica, arial, verdana, sans-serif;
        font-size: 13px;
        font-weight: 300;
        line-height: 19px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 20px;
        font-weight: 300;
      }
      .detail {
        font-family: "courier new", courier, monospace;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1a;
          color: #f2f2f2;
        }
      }
    </style>
  </head>
  <body>
    <h1>404 Not Found</h1>
    <p class="detail">no such file '[[URL]]'</p>
  </body>
</html>
